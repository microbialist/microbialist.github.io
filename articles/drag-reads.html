<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Drag reads onto the reference</title>
<meta name="description" content="Drag short sequencing reads onto a reference sequence and watch matches and mismatches appear as you slide each one into place.">
<meta name="tag" content="Interactive · D3">
<meta name="date" content="2026-09-01">
<script src="https://cdn.jsdelivr.net/npm/d3@7.9.0/dist/d3.min.js"></script>
<style>
  :root {
    --bg: #fbfcfd;
    --panel: #f0f4f7;
    --ink: #1c2733;
    --muted: #5f6f7d;
    --line: #cfd8df;
    --read: #dfe8ee;
    --read-edge: #9db0bf;
    --mismatch: #d6336c;
    --accent: #0f7b8a;
    --band: rgba(15, 123, 138, .11);
    --cov: #7fb7c0;
    --A: #1b8a5a; --C: #2b6cb0; --G: #b7791f; --T: #b83280;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #121a21; --panel: #1b2630; --ink: #e4ecf1; --muted: #93a4b2;
      --line: #2f3d49; --read: #26343f; --read-edge: #4f6577;
      --mismatch: #ff6b9a; --accent: #4cc3d3; --band: rgba(76, 195, 211, .14);
      --cov: #2f7480;
      --A: #52d49b; --C: #6fb0ff; --G: #f0b44c; --T: #f280c1;
    }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    background: var(--bg); color: var(--ink);
    font: 15px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    padding: 16px;
  }
  .widget { max-width: 1040px; margin: 0 auto; position: relative; }
  h1 { font-size: 1.2rem; margin: 0 0 4px; font-weight: 650; }
  .lede { margin: 0 0 14px; color: var(--muted); max-width: 72ch; }

  .hintbox {
    display: flex; align-items: flex-start; gap: 8px;
    background: var(--panel); border-radius: 10px; padding: 10px 14px; margin-bottom: 10px;
  }
  .hintbox input { margin-top: 4px; accent-color: var(--accent); }
  .hintbox label { font-size: .88rem; }
  .hintbox small { color: var(--muted); display: block; font-size: .78rem; line-height: 1.3; }

  .actions { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 10px; }
  button {
    font: inherit; font-size: .9rem; color: var(--ink);
    background: var(--bg); border: 1px solid var(--line);
    border-radius: 7px; padding: 6px 12px; cursor: pointer;
  }
  button:hover { border-color: var(--accent); }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) button.primary { color: #08242a; } }
  button:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  .stats { font-size: .9rem; margin: 6px 0 0; min-height: 1.5em; }
  .live { font-size: .9rem; margin: 0 0 6px; min-height: 1.5em; color: var(--accent); font-weight: 600; }
  .live.warn { color: var(--mismatch); }

  .stage { overflow-x: auto; border: 1px solid var(--line); border-radius: 10px; padding: 6px 4px 2px; }
  svg { display: block; width: 100%; min-width: 760px; height: auto; user-select: none; -webkit-user-select: none; }
  svg text { font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; }
  g.read.dragging { filter: drop-shadow(0 5px 7px rgba(0, 0, 0, .28)); }

  .legend { display: flex; flex-wrap: wrap; gap: 6px 18px; font-size: .82rem; color: var(--muted); margin: 8px 0 0; }
  .legend i { display: inline-block; width: 14px; height: 12px; border-radius: 2px; vertical-align: -1px; margin-right: 5px; }

  #tip {
    position: absolute; pointer-events: none; z-index: 5; max-width: 290px;
    background: var(--ink); color: var(--bg);
    font-size: .8rem; line-height: 1.4; padding: 7px 10px; border-radius: 7px;
    opacity: 0; transition: opacity .1s;
  }
  #tip code { font-family: ui-monospace, Menlo, Consolas, monospace; }
</style>
</head>
<body>
  <p style="margin:0 auto 12px;max-width:1040px;font-size:.9rem"><a href="../#articles" style="color:var(--accent)">← All articles</a></p>
<div class="widget">
  <h1>Drag reads onto the reference</h1>
  <p class="lede">Each read starts in the tray. Drag one over the reference and it snaps into place under the columns it covers, showing matches and mismatches as you slide it along.</p>

  <div class="hintbox">
    <input id="hint" type="checkbox">
    <label for="hint">Hint: show every start position
      <small>While dragging, a strip above the reference shows the mismatch count if the read started at each column.</small>
    </label>
  </div>

  <div class="actions">
    <button id="regen" class="primary" type="button">Simulate new reads</button>
    <button id="check" type="button">Check my placements</button>
    <button id="auto" type="button">Auto-map the rest</button>
    <button id="reset" type="button">Return all to tray</button>
  </div>

  <div class="live" id="live" aria-hidden="true"></div>
  <div class="stage"><svg id="chart" role="img" aria-label="Reference sequence with a lane for placing reads and a tray of unplaced reads"></svg></div>
  <div class="stats" id="stats" aria-live="polite"></div>

  <div class="legend">
    <span><i style="background:var(--read);border:1px solid var(--read-edge)"></i>Matching base</span>
    <span><i style="background:var(--mismatch)"></i>Mismatch</span>
    <span><i style="background:var(--cov)"></i>Coverage</span>
  </div>

  <div id="tip" role="tooltip"></div>
</div>

<script>
(() => {
  // ---------- Constants and layout ----------
  const REF_LEN = 60, READ_LEN = 14, N_READS = 16;
  const CELL = 17, M = 20, W = M * 2 + REF_LEN * CELL;
  const HEAT_TOP = 6, HEAT_H = 14, COV_TOP = 26, COV_H = 44, REF_Y = 88, REF_H = 24;
  const LANE_TOP = 130, ROW_H = 24, LANE_ROWS = 8, LANE_BOTTOM = LANE_TOP + LANE_ROWS * ROW_H;
  const TRAY_LABEL_Y = LANE_BOTTOM + 24, TRAY_TOP = TRAY_LABEL_Y + 12;
  const TRAY_COLS = 4, SLOT_W = 252, TRAY_ROW_H = 30;
  const H = TRAY_TOP + 4 * TRAY_ROW_H + 8;
  const DOCK_ZONE = LANE_TOP + 72;       // dragging above this y docks the read under the reference

  const reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  const clamp = (v, lo, hi) => Math.max(lo, Math.min(hi, v));

  // ---------- Reference (random, with no repeated 9-mers) ----------
  function lcg(seed) { return () => (seed = (seed * 1664525 + 1013904223) >>> 0) / 4294967296; }
  function buildReference() {
    const bases = "ACGT";
    for (let seed = 11; ; seed++) {
      const r = lcg(seed);
      const s = Array.from({ length: REF_LEN }, () => bases[Math.floor(r() * 4)]).join("");
      const seen = new Set();
      let dup = false;
      for (let i = 0; i + 9 <= REF_LEN; i++) {
        const k = s.slice(i, i + 9);
        if (seen.has(k)) { dup = true; break; }
        seen.add(k);
      }
      if (!dup) return s;
    }
  }
  const REF = buildReference();

  const mmList = (seq, col) => {
    const out = [];
    for (let i = 0; i < seq.length; i++) if (seq[i] !== REF[col + i]) out.push(i);
    return out;
  };

  // ---------- State ----------
  const state = { reads: [], hint: false, checked: false, dragging: false };
  let nextId = 1;

  // ---------- Read simulation (reads are exact substrings of the reference) ----------
  function makeRead(seq, origin) {
    const scores = [];
    for (let c = 0; c + seq.length <= REF_LEN; c++) scores.push(mmList(seq, c).length);
    const bestMM = Math.min(...scores);
    const bestPos = scores.map((s, c) => s === bestMM ? c : -1).filter(c => c >= 0);
    return { id: nextId++, seq, origin, scores, bestMM, bestPos,
             status: "tray", col: null, row: null, mm: [], x: 0, y: 0 };
  }
  function simulateReads() {
    // Exact substrings of the reference, taken from distinct start positions.
    const starts = d3.shuffle(d3.range(REF_LEN - READ_LEN + 1)).slice(0, N_READS);
    return starts.map(s => makeRead(REF.slice(s, s + READ_LEN), s));
  }

  // ---------- SVG scaffold ----------
  const svg = d3.select("#chart").attr("viewBox", `0 0 ${W} ${H}`);
  const tip = d3.select("#tip");
  const widget = document.querySelector(".widget");

  svg.append("rect").attr("x", M - 8).attr("y", REF_Y + REF_H + 6)
    .attr("width", REF_LEN * CELL + 16).attr("height", LANE_BOTTOM - (REF_Y + REF_H + 6) + 4)
    .attr("rx", 10).attr("fill", "var(--panel)").attr("opacity", .5)
    .attr("stroke", "var(--line)").attr("stroke-dasharray", "5 4");

  const bandRect = svg.append("rect").attr("y", REF_Y - 2).attr("height", LANE_BOTTOM - REF_Y + 2)
    .attr("rx", 3).attr("fill", "var(--band)").style("opacity", 0).style("pointer-events", "none");

  const staticLayer = svg.append("g");
  const covLayer = svg.append("g").style("pointer-events", "none");
  const heatLayer = svg.append("g").style("pointer-events", "none");
  const ladderLayer = svg.append("g").style("pointer-events", "none");
  const readLayer = svg.append("g");

  // Static content: reference, ruler, labels
  staticLayer.selectAll("text.ref").data(REF.split("")).join("text").attr("class", "ref")
    .attr("x", (d, i) => M + i * CELL + CELL / 2).attr("y", REF_Y + 17)
    .attr("text-anchor", "middle").attr("font-size", 15).attr("font-weight", 700)
    .attr("fill", d => `var(--${d})`).text(d => d);
  const ticks = d3.range(0, REF_LEN, 10);
  staticLayer.selectAll("line.tick").data(ticks).join("line").attr("class", "tick")
    .attr("x1", d => M + d * CELL).attr("x2", d => M + d * CELL)
    .attr("y1", REF_Y - 5).attr("y2", REF_Y - 1).attr("stroke", "var(--muted)");
  staticLayer.selectAll("text.pos").data(ticks).join("text").attr("class", "pos")
    .attr("x", d => M + d * CELL + 2).attr("y", REF_Y - 8).attr("font-size", 9)
    .attr("fill", "var(--muted)").text(d => d + 1);
  staticLayer.append("text").attr("x", M).attr("y", TRAY_LABEL_Y).attr("font-size", 11)
    .attr("fill", "var(--muted)").text("Unplaced reads: drag one onto the reference");
  const emptyHint = staticLayer.append("text").attr("x", W / 2).attr("y", LANE_TOP + 70)
    .attr("text-anchor", "middle").attr("font-size", 13).attr("fill", "var(--muted)")
    .text("Drop reads here, under the columns they should cover");

  // ---------- Read elements ----------
  const slotXY = i => ({ x: M + (i % TRAY_COLS) * SLOT_W, y: TRAY_TOP + Math.floor(i / TRAY_COLS) * TRAY_ROW_H });

  function buildReads() {
    readLayer.selectAll("*").remove();
    state.reads.forEach((d, i) => {
      const s = slotXY(i);
      d.x = s.x; d.y = s.y; d.slot = s;
      const g = readLayer.append("g").datum(d).attr("class", "read")
        .attr("transform", `translate(${d.x},${d.y})`)
        .style("cursor", "grab").style("touch-action", "none");
      d.g = g;
      const letters = d.seq.split("");
      g.selectAll("rect.base").data(letters).join("rect").attr("class", "base")
        .attr("x", (b, k) => k * CELL).attr("width", CELL - 1).attr("height", 19).attr("rx", 2);
      g.selectAll("text.b").data(letters).join("text").attr("class", "b")
        .attr("x", (b, k) => k * CELL + CELL / 2 - .5).attr("y", 14)
        .attr("text-anchor", "middle").attr("font-size", 13).style("pointer-events", "none").text(b => b);
      g.append("rect").attr("class", "outline").attr("width", d.seq.length * CELL - 1).attr("height", 19)
        .attr("rx", 3).attr("fill", "none").style("pointer-events", "none");
      g.append("text").attr("class", "tag").attr("y", 14).attr("font-size", 12).attr("font-weight", 700)
        .style("pointer-events", "none");

      g.on("mouseenter mousemove", (event) => hoverRead(event, d))
       .on("mouseleave", () => { tip.style("opacity", 0); if (!state.dragging) bandRect.style("opacity", 0); });

      if (!reduce) g.attr("opacity", 0).transition().delay(i * 45).duration(300).attr("opacity", 1);
    });
    drag(readLayer.selectAll("g.read"));
  }

  function moveTo(d, x, y, dur = 300, delay = 0) {
    const ix = d3.interpolateNumber(d.x, x), iy = d3.interpolateNumber(d.y, y);
    d.g.interrupt().transition().delay(delay).duration(reduce ? 0 : dur).ease(d3.easeCubicOut)
      .attrTween("transform", () => t => { d.x = ix(t); d.y = iy(t); return `translate(${d.x},${d.y})`; });
  }

  // ---------- Placement logic ----------
  function freeRow(col, len, except) {
    for (let r = 0; r < LANE_ROWS; r++) {
      const clash = state.reads.some(o => o !== except && o.status === "placed" && o.row === r &&
        col < o.col + o.seq.length + 1 && o.col < col + len + 1);
      if (!clash) return r;
    }
    return -1;
  }
  function place(d, col, row, dur = 220, delay = 0) {
    d.status = "placed"; d.col = col; d.row = row; d.mm = mmList(d.seq, col);
    moveTo(d, M + col * CELL, LANE_TOP + row * ROW_H, dur, delay);
  }
  function sendToTray(d, dur = 350, delay = 0) {
    d.status = "tray"; d.col = null; d.row = null; d.mm = [];
    moveTo(d, d.slot.x, d.slot.y, dur, delay);
  }

  // ---------- Verdicts (shown after “Check my placements”) ----------
  const pos1 = c => c + 1;
  function verdict(d) {
    if (!d.bestPos.includes(d.col)) {
      return { kind: "worse", glyph: "?", color: "var(--G)",
               msg: `A better spot exists: ${mmText(d.bestMM)} at position ${d.bestPos.map(pos1).join(" or ")}.` };
    }
    if (d.bestPos.length > 1) {
      const others = d.bestPos.filter(c => c !== d.col).map(pos1).join(", ");
      return { kind: "ambiguous", glyph: "≈", color: "var(--G)",
               msg: `Also fits equally well at ${others}, so a mapper could not tell these apart.` };
    }
    return { kind: "best", glyph: "✓", color: "var(--accent)", msg: "Best placement." };
  }
  const mmText = n => n === 0 ? "no mismatches" : n === 1 ? "1 mismatch" : `${n} mismatches`;

  // ---------- Painting ----------
  function paintRead(d) {
    const g = d.g, len = d.seq.length;
    let col = null;
    if (d.status === "placed") col = d.col;
    else if (d.status === "dragging" && d.docked) col = d.dragCol;
    const bad = col == null ? null : new Set(mmList(d.seq, col));

    g.selectAll("rect.base").attr("fill", (b, i) => bad && bad.has(i) ? "var(--mismatch)" : "var(--read)");
    g.selectAll("text.b")
      .attr("fill", (b, i) => !bad ? `var(--${d.seq[i]})` : bad.has(i) ? "#fff" : "var(--ink)")
      .attr("font-weight", (b, i) => bad && bad.has(i) ? 800 : 600);
    g.select("rect.outline").attr("stroke", "var(--read-edge)").attr("stroke-width", 1);

    let txt = "", color = "var(--accent)";
    if (d.status === "dragging" && d.docked) {
      const n = bad.size;
      txt = n === 0 ? "perfect match" : mmText(n);
      color = n === 0 ? "var(--accent)" : "var(--mismatch)";
    } else if (d.status === "placed" && state.checked) {
      const v = verdict(d); txt = v.glyph; color = v.color;
    }
    const need = Math.ceil((txt.length * 7.6 + 10) / CELL);
    const left = col != null && (REF_LEN - (col + len)) < need;
    g.select("text.tag").text(txt).attr("fill", color)
      .attr("x", left ? -7 : len * CELL + 7).attr("text-anchor", left ? "end" : "start");
  }

  function drawCoverage() {
    const cov = new Array(REF_LEN).fill(0);
    state.reads.filter(d => d.status === "placed").forEach(d => {
      for (let i = 0; i < d.seq.length; i++) cov[d.col + i]++;
    });
    const top = d3.max(cov);
    const y = d3.scaleLinear().domain([0, Math.max(4, top)]).range([COV_H, 0]);
    covLayer.selectAll("*").remove();
    covLayer.selectAll("rect").data(cov).join("rect")
      .attr("x", (v, i) => M + i * CELL).attr("width", CELL - 1)
      .attr("y", v => COV_TOP + y(v)).attr("height", v => COV_H - y(v))
      .attr("fill", "var(--cov)").attr("rx", 1);
    covLayer.append("text").attr("x", M).attr("y", COV_TOP + 8).attr("font-size", 10)
      .attr("fill", "var(--muted)").text(top ? `coverage (max ${top}×)` : "coverage");
  }

  function drawStats() {
    const reads = state.reads;
    const placed = reads.filter(d => d.status === "placed");
    const tray = reads.filter(d => d.status === "tray");
    let text = placed.length
      ? `Placed ${placed.length} of ${reads.length} reads.`
      : "Nothing placed yet. Drag a read from the tray onto the reference.";
    if (state.checked) {
      const c = { best: 0, ambiguous: 0, worse: 0 };
      placed.forEach(d => c[verdict(d).kind]++);
      const parts = [];
      if (c.best) parts.push(`${c.best} in the best spot`);
      if (c.ambiguous) parts.push(`${c.ambiguous} ambiguous (an equally good spot exists elsewhere)`);
      if (c.worse) parts.push(`${c.worse} with a better spot available`);
      text += " Check: " + (parts.join(", ") || "no placed reads yet") + ".";
      if (tray.length) text += ` ${tray.length} still in the tray.`;
      if (placed.length) text += " Hover a placed read for details.";
    }
    document.getElementById("stats").textContent = text;
    emptyHint.style("opacity", placed.length || state.dragging ? 0 : 1);
  }

  function refresh() {
    drawCoverage();
    state.reads.forEach(paintRead);
    drawStats();
  }

  // ---------- Overlays used while dragging ----------
  function showBand(col, len) {
    bandRect.attr("x", M + col * CELL).attr("width", len * CELL - 1).style("opacity", 1);
  }
  function drawLadder(d, col) {
    ladderLayer.selectAll("*").remove();
    const bad = new Set(mmList(d.seq, col));
    const y1 = REF_Y + REF_H, y2 = LANE_TOP, ym = (y1 + y2) / 2;
    d.seq.split("").forEach((b, i) => {
      const x = M + (col + i) * CELL + CELL / 2, miss = bad.has(i);
      ladderLayer.append("line").attr("x1", x).attr("x2", x).attr("y1", y1).attr("y2", y2)
        .attr("stroke", miss ? "var(--mismatch)" : "var(--accent)")
        .attr("stroke-width", miss ? 2 : 1).attr("opacity", miss ? .9 : .45);
      if (miss) {
        ladderLayer.append("circle").attr("cx", x).attr("cy", ym).attr("r", 6).attr("fill", "var(--mismatch)");
        ladderLayer.append("path").attr("d", `M${x - 2.6},${ym - 2.6}L${x + 2.6},${ym + 2.6}M${x + 2.6},${ym - 2.6}L${x - 2.6},${ym + 2.6}`)
          .attr("stroke", "#fff").attr("stroke-width", 1.6).attr("stroke-linecap", "round");
      } else {
        ladderLayer.append("circle").attr("cx", x).attr("cy", ym).attr("r", 2.5).attr("fill", "var(--accent)");
      }
    });
  }
  function drawHeat(d) {
    heatLayer.selectAll("*").remove();
    if (!state.hint) return;
    d.scores.forEach((n, c) => {
      const x = M + c * CELL;
      heatLayer.append("rect").attr("x", x).attr("y", HEAT_TOP).attr("width", CELL - 1).attr("height", HEAT_H)
        .attr("rx", 2).attr("fill", "var(--accent)").attr("opacity", Math.max(.1, 1 - n / 7))
        .attr("stroke", n === d.bestMM ? "var(--accent)" : "none").attr("stroke-width", 1.2);
      heatLayer.append("text").attr("x", x + CELL / 2 - .5).attr("y", HEAT_TOP + 11).attr("font-size", 9)
        .attr("text-anchor", "middle").attr("fill", "var(--ink)").text(n);
    });
    heatLayer.append("rect").attr("class", "cur").attr("y", HEAT_TOP - 2).attr("width", CELL + 1).attr("height", HEAT_H + 4)
      .attr("rx", 3).attr("fill", "none").attr("stroke", "var(--ink)").attr("stroke-width", 1.6).style("opacity", 0);
    heatLayer.append("text").attr("x", M + d.scores.length * CELL + 8).attr("y", HEAT_TOP + 11).attr("font-size", 10)
      .attr("fill", "var(--muted)").text("mismatches if the read starts here");
  }
  function clearOverlays() {
    ladderLayer.selectAll("*").remove();
    heatLayer.selectAll("*").remove();
    bandRect.style("opacity", 0);
  }

  // ---------- Dragging ----------
  const live = document.getElementById("live");
  function setLive(text, warn) { live.textContent = text; live.classList.toggle("warn", !!warn); }

  function beginDrag(d) {
    d.g.interrupt();
    d.status = "dragging"; d.docked = false;
    d.g.classed("dragging", true).style("cursor", "grabbing");
    state.dragging = true; state.checked = false;
    tip.style("opacity", 0);
    drawHeat(d);
    refresh();
  }

  function onDrag(event, d) {
    if (!d.moved) { d.moved = true; beginDrag(d); }
    const len = d.seq.length;
    const col = clamp(Math.round((event.x - M) / CELL), 0, REF_LEN - len);
    d.dragCol = col;
    d.docked = event.y < DOCK_ZONE;
    if (d.docked) { d.x = M + col * CELL; d.y = LANE_TOP; }
    else { d.x = event.x; d.y = event.y; }
    d.g.attr("transform", `translate(${d.x},${d.y})`);
    paintRead(d);

    const cur = heatLayer.select("rect.cur");
    if (d.docked) {
      const n = mmList(d.seq, col).length;
      drawLadder(d, col);
      showBand(col, len);
      if (!cur.empty()) cur.attr("x", M + col * CELL - .5).style("opacity", 1);
      setLive(`Positions ${col + 1}–${col + len}: ${mmText(n)}, ${len - n} of ${len} bases match.`, n > 0);
    } else {
      ladderLayer.selectAll("*").remove();
      bandRect.style("opacity", 0);
      if (!cur.empty()) cur.style("opacity", 0);
      setLive("Move the read over the reference to compare it.");
    }
  }

  function onEnd(event, d) {
    if (!d.moved) return;
    d.moved = false;
    clearOverlays();
    state.dragging = false;
    d.g.classed("dragging", false).style("cursor", "grab");
    if (d.docked) {
      const row = freeRow(d.dragCol, d.seq.length, d);
      if (row >= 0) { place(d, d.dragCol, row); setLive(""); }
      else { sendToTray(d); setLive("No room at that position. Try a different spot.", true); }
    } else {
      sendToTray(d); setLive("");
    }
    d.docked = false;
    refresh();
  }

  const drag = d3.drag().container(readLayer.node())
    .on("start", function (event, d) { d.moved = false; d3.select(this).raise(); })
    .on("drag", onDrag)
    .on("end", onEnd);

  // ---------- Tooltip on placed reads ----------
  function hoverRead(event, d) {
    if (state.dragging || d.status !== "placed") return;
    const len = d.seq.length, n = mmList(d.seq, d.col).length;
    let html = `<code>${d.seq}</code><br>Positions ${d.col + 1}–${d.col + len}, ${mmText(n)}`;
    if (state.checked) {
      html += `<br>${verdict(d).msg}<br>Taken from position ${d.origin + 1}.`;
    }
    tip.html(html).style("opacity", 1);
    const box = widget.getBoundingClientRect();
    tip.style("left", Math.min(event.clientX - box.left + 14, box.width - 300) + "px")
       .style("top", (event.clientY - box.top + 18) + "px");
    showBand(d.col, len);
  }

  // ---------- Controls ----------
  const $ = id => document.getElementById(id);
  function newBatch() {
    state.reads = simulateReads();
    state.checked = false;
    setLive("");
    buildReads();
    refresh();
  }

  $("hint").addEventListener("change", e => { state.hint = e.target.checked; });
  $("regen").addEventListener("click", newBatch);
  $("check").addEventListener("click", () => { state.checked = true; refresh(); });
  $("reset").addEventListener("click", () => {
    state.checked = false;
    state.reads.forEach((d, i) => { if (d.status !== "tray") sendToTray(d, 400, i * 30); });
    setLive(""); refresh();
  });
  $("auto").addEventListener("click", () => {
    state.checked = false;
    let k = 0;
    state.reads.filter(d => d.status === "tray").forEach(d => {
      const col = d.bestPos[0], row = freeRow(col, d.seq.length, d);
      if (row < 0) return;
      place(d, col, row, 650, k++ * 140);
    });
    setLive(""); refresh();
  });

  // ---------- Go ----------
  newBatch();
})();
</script>
<script>
(function () {
  function post() {
    parent.postMessage({ reprHeight: Math.ceil(document.body.getBoundingClientRect().height) }, "*");
  }
  new ResizeObserver(post).observe(document.body);
  window.addEventListener("load", post);
})();
</script>
</body>
