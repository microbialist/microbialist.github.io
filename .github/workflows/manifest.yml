name: Update article index
on:
  push:
    branches: [main]
    paths: ["articles/*.html", "scripts/build_manifest.py"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  manifest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/build_manifest.py
      - name: Commit manifest if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add articles/manifest.json
          git diff --cached --quiet || (git commit -m "Update article manifest" && git push)
